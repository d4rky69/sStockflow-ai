spring:
  datasource:
    url: jdbc:h2:mem:stockflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/h2migration,classpath:db/h2support,classpath:db/devdata
    validate-on-migrate: true

logging:
  level:
    org.hibernate.SQL: WARN
